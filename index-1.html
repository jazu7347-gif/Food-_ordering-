<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Food Ordering Website</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
<h1>FoodHub</h1>
<input type="search" id="searchInput" placeholder="Search food by name...">
</header>
<main class="layout">
<section class="menu-section">
<div class="filters" id="categoryFilters"></div>
<div class="menu-grid" id="menuGrid"></div>
<p class="no-results" id="noResults" hidden>No dishes match your search.</p>
</section>
<aside class="cart">
<h2>Your Order</h2>
<div id="cartItems"></div>
<p class="empty-msg" id="emptyMsg">Your cart is empty. Add some delicious dishes!</p>
<div class="summary" id="summary" hidden>
<div class="row"><span>Items</span><span id="itemCount">0</span></div>
<div class="row total"><span>Total</span><span id="orderTotal">Rs. 0</span></div>
</div>
<form id="checkoutForm" novalidate hidden>
<h3>Delivery Details</h3>
<label>Full Name
<input type="text" id="custName" placeholder="Enter your name">
</label>
<small class="error" data-for="custName"></small>
<label>Phone Number
<input type="tel" id="custPhone" placeholder="10-digit mobile number">
</label>
<small class="error" data-for="custPhone"></small>
<label>Delivery Address
<textarea id="custAddress" rows="2" placeholder="House no, street, area"></textarea>
</label>
<small class="error" data-for="custAddress"></small>
<button type="submit" class="place-btn">Place Order</button>
</form>
<div class="success" id="successMsg" hidden>
<h3>Order Submitted!</h3>
<p>Thank you for your order. Your food will be on the way soon.</p>
</div>
</aside>
</main>
<script src="script.js"></script>
</body>
</html>
